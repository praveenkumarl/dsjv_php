<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="pdf-exportable" content="true">
    <title>Panchang Report</title>
    <link rel="stylesheet" href="css/panchang-pdf.css">
    <style>
        @page {
            size: A4;
            margin: 9mm;
        }
    </style>
</head>
<body class="panchang-pdf-view">
    <main id="onepage">
        <div id="targetDiv"></div>
    </main>
    <script src="html2pdf.bundle.min.js" type="text/javascript"></script>
    <script>
        var PDF_FILENAME = 'panchang.pdf';

        function generatePDF() {
            generateAppPdf(PDF_FILENAME);
        }

        document.addEventListener('DOMContentLoaded', function() {
            var target = document.getElementById('targetDiv');
            var content = localStorage.getItem('divContent');

            if (content) {
                target.innerHTML = content;
                localStorage.removeItem('divContent');
                var reportDate = target.querySelector('.onepage_panchang_date');
                if (reportDate && reportDate.textContent.trim()) {
                    PDF_FILENAME = 'panchang_' + reportDate.textContent.trim().replace(/[^a-zA-Z0-9_-]/g, '_') + '.pdf';
                }
                return;
            }

            var status = document.createElement('p');
            status.id = 'reportStatus';
            status.textContent = 'Panchang report content is unavailable. Return to Panchang and generate the report again.';
            target.appendChild(status);
        });
    </script>
    <script src="pdf_bridge.js?v=1" type="text/javascript"></script>
</body>
</html>
