     <script>
        function loadStylesheet(href) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href + '?' + new Date().getTime(); // Append timestamp as query parameter
            document.head.appendChild(link);
        }

        // Load stylesheets
        loadStylesheet('css/main.css');
        loadStylesheet('css/birth_chart_style.css');
        loadStylesheet('style.css');
        
        window.onload = function() {
            const content = localStorage.getItem('divContent');
            if (content) {
                document.getElementById('targetDiv').innerHTML = content;
                // Clear the localStorage item after use if needed
                localStorage.removeItem('divContent');
            }
            
            updateDateTime();
        };
        
        function updateDateTime() {
            var now = new Date();
            var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            var formattedDateTime = now.toLocaleString('en-IN', options);
            document.getElementById('currentDateTime').textContent = " | " + formattedDateTime;
        }
        
    </script>
</head>
<body>
   <div class="panchangBorder" id="targetDiv"></div>
